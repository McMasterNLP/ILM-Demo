services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ilm
      POSTGRES_PASSWORD: ilm
      POSTGRES_DB: ilm
    ports:
      # 5433 on the host: a local Postgres already owns 5432 on this machine.
      # Inside the compose network the service still talks to db:5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ilm -d ilm"]
      interval: 5s
      timeout: 5s
      retries: 10

  service:
    build: ./service
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Overrides the host-facing value in service/.env.
      DATABASE_URL: postgresql+psycopg://ilm:ilm@db:5432/ilm
      CORS_ORIGINS: http://localhost:5173
    env_file:
      - ./service/.env
    ports:
      - "8000:8000"
    volumes:
      # Uploaded source documents outlive the container.
      - uploads:/app/storage/uploads
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
  uploads:
